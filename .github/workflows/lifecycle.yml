name: Lifecycle

on:
  issues:
    types: [opened, labeled, assigned, unassigned]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [labeled, closed, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Verify event and update batch lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.WORKFLOW_PROJECT_TOKEN }}
        run: >-
          python3 .workflow/scripts/sync_lifecycle.py
          --github-repository "${{ github.repository }}"
          --event-name "${{ github.event_name }}"
          --event-path "${{ github.event_path }}"
