name: Landing CI

on:
  pull_request:
    types: [ready_for_review, auto_merge_enabled, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  checks: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.verify.outputs.active }}
    steps:
      - name: Check out trusted controller code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .controller-source
          persist-credentials: false

      - name: Create read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WORKFLOW_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Verify the authoritative active candidate
        id: verify
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          mkdir -p .tmp/controller
          python3 .controller-source/.workflow/github_snapshot.py collect \
            --config .controller-source/.workflow/controller-config.json \
            --output .tmp/controller/snapshot.json
          python3 .controller-source/.workflow/controller.py authorize-ci \
            --snapshot .tmp/controller/snapshot.json \
            --pull-request "${{ github.event.pull_request.number }}"
          echo 'active=true' >> "$GITHUB_OUTPUT"

  landing-gate:
    needs: authorize
    if: needs.authorize.outputs.active == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the candidate under test
        uses: actions/checkout@v4

      # Repository setup must replace this step with the exact full local gate
      # commands recorded in AGENTS.md. It fails closed until that is done.
      - name: Run repository landing gate
        shell: bash
        run: |
          echo 'Landing CI is not configured. Run configure-github-workflow.' >&2
          exit 1
