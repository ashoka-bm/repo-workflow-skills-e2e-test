name: Landing CI

on:
  pull_request:
    types: [ready_for_review, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  landing-evidence:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted evidence validator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .workflow-source
          persist-credentials: false

      - name: Verify evidence for the pull request's current commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 .workflow-source/.workflow/scripts/validate_landing_evidence.py \
            --github-repository "${{ github.repository }}" \
            --pull-request "${{ github.event.pull_request.number }}"

  landing-gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out the candidate under test
        uses: actions/checkout@v4

      - name: Run repository landing gate
        shell: bash
        run: |
          python3 -m unittest discover
          python3 -m compileall .
